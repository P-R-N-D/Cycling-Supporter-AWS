apply plugin: 'com.android.application'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def configValue = { name ->
    def value = localProperties.getProperty(name)
    if (value == null || value.trim().isEmpty()) {
        value = System.getenv(name)
    }
    if (value == null) {
        value = ''
    }
    return value.replace('\\', '\\\\').replace('"', '\\"')
}

android {
    compileSdkVersion 29
    defaultConfig {
        applicationId "com.example.vntek.cycling"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 3
        versionName "4.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", "\"${configValue('API_BASE_URL')}\""
        buildConfigField "String", "TMAP_APP_KEY", "\"${configValue('TMAP_APP_KEY')}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    implementation 'com.android.volley:volley:1.1.1'
    implementation 'com.google.android.gms:play-services-base:17.1.0'
    implementation 'com.google.android.gms:play-services-location:17.0.0'


}
